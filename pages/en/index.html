<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="User guides, SDK development, and API references for the Genisom L1 and Genisom M1 robots.">
    <link rel="alternate" hreflang="zh-CN" href="../">
    <title>Genisom AI Developer Documentation</title>
    <link rel="stylesheet" href="../styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="shell topbar">
        <div class="brand">
          <div class="brand-logos">
            <img src="../assets/genisomai-logo.png" alt="Genisom AI" width="480" height="136">
            <img src="../assets/eai-logo.png" alt="EAI Academy" width="240" height="145">
          </div>
          <strong>Developer Docs</strong>
        </div>
        <a class="language-switch" href="../" lang="zh-CN" hreflang="zh-CN">中文</a>
      </div>
    </header>
    <main class="shell">
      <section class="hero" aria-labelledby="page-title">
        <div class="hero-copy">
          <h1 id="page-title">Product Documentation</h1>
          <p>User Guides · SDK Development · API Reference</p>
        </div>
        <img src="../assets/family.jpg" width="1800" height="1012" alt="Genisom AI robot lineup" fetchpriority="high">
      </section>
      <section class="catalog" aria-labelledby="catalog-title">
        <h2 id="catalog-title">Choose a Product</h2>
        <div class="products">
          <a class="product" href="../l1-en/" aria-labelledby="l1-title l1-action">
            <div class="product-image">
              <img src="../assets/l1.png" width="800" height="693" alt="" decoding="async">
            </div>
            <div class="product-copy">
              <h3 id="l1-title">Genisom L1</h3>
              <p>Quadruped Robot series</p>
              <span class="product-action" id="l1-action">View docs <span aria-hidden="true">→</span></span>
            </div>
          </a>
          <a class="product" href="../m1-en/" aria-labelledby="m1-title m1-action">
            <div class="product-image">
              <img src="../assets/m1.png" width="800" height="593" alt="" decoding="async">
            </div>
            <div class="product-copy">
              <h3 id="m1-title">Genisom M1</h3>
              <p>Wheeled-Legged Robot series</p>
              <span class="product-action" id="m1-action">View docs <span aria-hidden="true">→</span></span>
            </div>
          </a>
          <article class="product product-l2" aria-labelledby="l2-title">
            <div class="product-image">
              <img src="../assets/l2.png" width="800" height="699" alt="" loading="lazy" decoding="async">
            </div>
            <div class="product-copy">
              <h3 id="l2-title">Genisom L2</h3>
              <p class="product-status">Coming Soon</p>
            </div>
          </article>
        </div>
      </section>
    </main>
  </body>
</html>
