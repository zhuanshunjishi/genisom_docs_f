<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="User guides, SDK development, and API references for the Genisom L1 and Genisom M1 robots.">
    <link rel="alternate" hreflang="zh-CN" href="../">
    <title>Genisom AI Developer Documentation</title>
    <link rel="stylesheet" href="../styles.css">
    <script type="module" src="../product-models.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="shell topbar">
        <div class="brand">
          <div class="brand-logos">
            <img src="../assets/genisomai-logo.png" alt="Genisom AI" width="480" height="136">
          </div>
          <strong>Developer Docs</strong>
        </div>
        <a class="language-switch" href="../" lang="zh-CN" hreflang="zh-CN">中文</a>
      </div>
    </header>
    <main class="shell">
      <section class="hero" aria-labelledby="page-title">
        <div class="hero-copy">
          <h1 id="page-title">Product Documentation</h1>
          <p>User Guides · SDK Development · API Reference</p>
        </div>
        <img src="../assets/family.jpg" width="1800" height="1012" alt="Genisom AI robot lineup" fetchpriority="high">
      </section>
      <section class="catalog" aria-labelledby="catalog-title">
        <h2 id="catalog-title">Choose a Product</h2>
        <div class="products">
          <article class="product product-l1">
            <div class="product-image product-preview">
              <model-viewer src="../assets/models/l1.glb" alt="Genisom L1 3D model"
                camera-controls disable-pan touch-action="pan-y" interaction-prompt="none"
                auto-rotate-delay="600" rotation-per-second="18deg"
                camera-orbit="58deg 68deg 100%" shadow-intensity="0.45"></model-viewer>
              <span class="product-preview-label" hidden>Interactive 3D Model</span>
            </div>
            <a class="product-copy" href="../l1-en/" aria-labelledby="l1-title l1-action">
              <h3 id="l1-title">Genisom L1</h3>
              <span class="product-action" id="l1-action">View docs <span aria-hidden="true">→</span></span>
            </a>
          </article>
          <article class="product product-m1">
            <div class="product-image product-preview">
              <model-viewer src="../assets/models/m1.glb" alt="Genisom M1 3D model"
                camera-controls disable-pan touch-action="pan-y" interaction-prompt="none"
                auto-rotate-delay="600" rotation-per-second="18deg"
                camera-orbit="57deg 68deg 96%" shadow-intensity="0.45"></model-viewer>
              <span class="product-preview-label" hidden>Interactive 3D Model</span>
            </div>
            <a class="product-copy" href="../m1-en/" aria-labelledby="m1-title m1-action">
              <h3 id="m1-title">Genisom M1</h3>
              <span class="product-action" id="m1-action">View docs <span aria-hidden="true">→</span></span>
            </a>
          </article>
          <a class="product product-l2" href="../l2/" hreflang="zh-CN" aria-labelledby="l2-title l2-action">
            <div class="product-image">
              <img src="../assets/l2.png" width="800" height="699" alt="" loading="lazy" decoding="async">
            </div>
            <div class="product-copy">
              <h3 id="l2-title">Genisom L2</h3>
              <span class="product-action" id="l2-action">View Chinese Docs <span aria-hidden="true">→</span></span>
            </div>
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
