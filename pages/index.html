<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="智身钢镚 L1、智身铜锤 M1 和智身钢镚 L2 的设备使用指南、SDK 开发文档和接口参考。">
    <link rel="alternate" hreflang="en" href="./en/">
    <title>智身科技开发者文档</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./product-models.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="shell topbar">
        <div class="brand">
          <div class="brand-logos">
            <img src="./assets/genisomai-logo.png" alt="Genisom AI" width="480" height="136">
          </div>
          <strong>开发者文档</strong>
        </div>
        <nav class="header-nav" aria-label="顶部导航">
          <a class="header-link" href="http://eai.genisomai.com">智身科技 EAI 学院</a>
          <a class="header-link" href="https://www.genisomai.com/">智身科技官网</a>
          <a class="language-switch" href="./en/" lang="en" hreflang="en">English</a>
        </nav>
      </div>
    </header>
    <main class="shell">
      <section class="hero" aria-labelledby="page-title">
        <div class="hero-copy">
          <h1 id="page-title">产品开发文档</h1>
          <p>设备使用指南 · SDK 开发流程 · 接口参考</p>
        </div>
        <img src="./assets/family-preview.webp" data-full-src="./assets/family.webp"
          width="1800" height="1012" alt="智身科技机器人产品全家福" fetchpriority="high" decoding="async">
      </section>
      <section class="catalog" aria-labelledby="catalog-title">
        <h2 id="catalog-title">四足机器人</h2>
        <div class="products">
          <article class="product product-l1">
            <div class="product-image product-preview">
              <img class="product-poster" src="./assets/l1-preview.webp" alt=""
                width="460" height="398" loading="lazy" decoding="async">
              <model-viewer data-src="./assets/models/l1.glb" loading="eager" alt="智身钢镚 L1 三维模型"
                camera-controls disable-pan touch-action="pan-y" interaction-prompt="none"
                auto-rotate-delay="600" rotation-per-second="18deg"
                camera-orbit="58deg 68deg 100%" shadow-intensity="0.45"></model-viewer>
              <span class="product-preview-label" hidden>试着拖动我吧！</span>
            </div>
            <a class="product-copy" href="./l1/" aria-labelledby="l1-title l1-action">
              <h3 id="l1-title">智身钢镚 L1</h3>
              <span class="product-action" id="l1-action">查看文档 <span aria-hidden="true">→</span></span>
            </a>
          </article>
          <article class="product product-m1">
            <div class="product-image product-preview">
              <img class="product-poster" src="./assets/m1-preview.webp" alt=""
                width="460" height="341" loading="lazy" decoding="async">
              <model-viewer data-src="./assets/models/m1.glb" loading="eager" alt="智身铜锤 M1 三维模型"
                camera-controls disable-pan touch-action="pan-y" interaction-prompt="none"
                auto-rotate-delay="600" rotation-per-second="18deg"
                camera-orbit="57deg 68deg 96%" shadow-intensity="0.45"></model-viewer>
              <span class="product-preview-label" hidden>试着拖动我吧！</span>
            </div>
            <a class="product-copy" href="./m1/" aria-labelledby="m1-title m1-action">
              <h3 id="m1-title">智身铜锤 M1</h3>
              <span class="product-action" id="m1-action">查看文档 <span aria-hidden="true">→</span></span>
            </a>
          </article>
          <article class="product product-l2">
            <div class="product-image product-preview">
              <img class="product-poster" src="./assets/l2-preview.webp" alt=""
                width="460" height="402" loading="lazy" decoding="async">
              <model-viewer data-src="./assets/models/l2.glb" loading="eager" alt="智身钢镚 L2-W Ultra 三维模型"
                camera-controls disable-pan touch-action="pan-y" interaction-prompt="none"
                auto-rotate-delay="600" rotation-per-second="18deg"
                camera-orbit="58deg 74deg 100%" shadow-intensity="0.45"></model-viewer>
              <span class="product-preview-label" hidden>试着拖动我吧！</span>
            </div>
            <a class="product-copy" href="./l2/" hreflang="zh-CN" aria-labelledby="l2-title l2-action">
              <h3 id="l2-title">智身钢镚 L2</h3>
              <span class="product-action" id="l2-action">查看文档 <span aria-hidden="true">→</span></span>
            </a>
          </article>
        </div>
      </section>
      <section class="catalog" aria-labelledby="humanoid-title">
        <h2 id="humanoid-title">人形机器人</h2>
        <div class="products">
          <article class="product product-upcoming product-ne01">
            <div class="product-image product-preview">
              <img class="product-poster" src="./assets/ne01-preview.webp" alt=""
                width="768" height="432" loading="lazy" decoding="async">
              <model-viewer data-src="./assets/models/NE01.glb" loading="eager" alt="智身银毅 NE01 三维模型"
                camera-controls disable-pan touch-action="pan-y" interaction-prompt="none"
                auto-rotate-delay="600" rotation-per-second="18deg"
                camera-orbit="28deg 80deg 105%" shadow-intensity="0.45"></model-viewer>
              <span class="product-preview-label" hidden>试着拖动我吧！</span>
            </div>
            <div class="product-copy">
              <h3>智身银毅 NE01</h3>
              <span class="product-status"><span lang="en">Coming Soon</span> · 即将到来</span>
            </div>
          </article>
        </div>
      </section>
      <section class="catalog" aria-labelledby="software-title">
        <h2 id="software-title">软件与工具链</h2>
        <div class="products">
          <article class="product product-upcoming product-software product-matrix">
            <div class="product-image product-art">
              <img src="./assets/matrix-preview.webp" data-full-src="./assets/matrix.webp"
                data-full-srcset="./assets/matrix-960.webp 960w, ./assets/matrix.webp 1746w"
                data-full-sizes="(max-width: 600px) calc(100vw - 34px), min(31vw, 445px)"
                alt="MATRiX 林地机器人仿真场景"
                width="1746" height="1086" loading="lazy" decoding="async">
            </div>
            <div class="product-copy">
              <h3>MATRiX</h3>
              <span class="product-status"><span lang="en">Coming Soon</span> · 即将到来</span>
            </div>
          </article>
          <article class="product product-upcoming product-software product-roamerx">
            <div class="product-image product-art">
              <img src="./assets/roamerx-pro-preview.webp" data-full-src="./assets/roamerx-pro.webp" alt="智航 Pro 导航点云地图"
                width="641" height="417" loading="lazy" decoding="async">
            </div>
            <div class="product-copy">
              <h3>智航 Pro</h3>
              <span class="product-status"><span lang="en">Coming Soon</span> · 即将到来</span>
            </div>
          </article>
        </div>
      </section>
    </main>
  </body>
</html>
