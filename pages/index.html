<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="智身钢镚 L1 与智身铜锤 M1 的设备使用、SDK 开发和接口参考。">
    <link rel="alternate" hreflang="en" href="./en/">
    <title>智身科技开发者文档</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="shell topbar">
        <div class="brand">
          <div class="brand-logos">
            <img src="./assets/genisomai-logo.png" alt="Genisom AI" width="480" height="136">
            <img src="./assets/eai-logo.png" alt="EAI Academy" width="240" height="145">
          </div>
          <strong>开发者文档</strong>
        </div>
        <a class="language-switch" href="./en/" lang="en" hreflang="en">English</a>
      </div>
    </header>
    <main class="shell">
      <section class="hero" aria-labelledby="page-title">
        <div class="hero-copy">
          <h1 id="page-title">产品开发文档</h1>
          <p>设备使用指南 · SDK 开发流程 · 接口参考</p>
        </div>
        <img src="./assets/family.jpg" width="1800" height="1012" alt="智身科技机器人产品全家福" fetchpriority="high">
      </section>
      <section class="catalog" aria-labelledby="catalog-title">
        <h2 id="catalog-title">选择产品</h2>
        <div class="products">
          <a class="product product-l1" href="./l1/" aria-labelledby="l1-title l1-action">
            <div class="product-image">
              <img src="./assets/l1.png" width="800" height="693" alt="" decoding="async">
            </div>
            <div class="product-copy">
              <h3 id="l1-title">智身钢镚 L1</h3>
              <p>四足机器人系列</p>
              <span class="product-action" id="l1-action">查看文档 <span aria-hidden="true">→</span></span>
            </div>
          </a>
          <a class="product product-m1" href="./m1/" aria-labelledby="m1-title m1-action">
            <div class="product-image">
              <img src="./assets/m1.png" width="800" height="593" alt="" decoding="async">
            </div>
            <div class="product-copy">
              <h3 id="m1-title">智身铜锤 M1</h3>
              <p>轮足机器人系列</p>
              <span class="product-action" id="m1-action">查看文档 <span aria-hidden="true">→</span></span>
            </div>
          </a>
          <a class="product" href="./l2/" hreflang="zh-CN" aria-labelledby="l2-title l2-action">
            <div class="product-image">
              <img src="./assets/l2.png" width="800" height="699" alt="" loading="lazy" decoding="async">
            </div>
            <div class="product-copy">
              <h3 id="l2-title">智身钢镚 L2</h3>
              <span class="product-action" id="l2-action">查看文档 <span aria-hidden="true">→</span></span>
            </div>
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
