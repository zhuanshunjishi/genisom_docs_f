<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">M1 SDK network architecture</title>
  <desc id="desc">The motion control and navigation hosts connect through a switch. The SDK host connects over Wi-Fi or one of two external Ethernet ports.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity=".09"/>
    </filter>
    <marker id="m-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="m-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <style>
      text { font-family: Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .title { font-size: 38px; font-weight: 750; }
      .subtitle { font-size: 21px; fill: #475569; }
      .panel-title { font-size: 25px; font-weight: 750; }
      .box-title { font-size: 23px; font-weight: 750; text-anchor: middle; }
      .box-text { font-size: 18px; font-weight: 650; text-anchor: middle; }
      .box-sub { font-size: 17px; fill: #475569; text-anchor: middle; }
      .link-label { font-size: 18px; }
      .legend { font-size: 17px; fill: #475569; }
    </style>
  </defs>

  <rect width="1200" height="780" fill="#f8fafc"/>
  <text x="40" y="56" class="title" textLength="255" lengthAdjust="spacingAndGlyphs">M1 robot network architecture</text>
  <text x="40" y="88" class="subtitle" textLength="664" lengthAdjust="spacingAndGlyphs">SDK clients send commands and receive state data from the motion control host over Wi-Fi or Ethernet.</text>

  <!-- 图例 -->
  <line x1="930" y1="50" x2="966" y2="50" stroke="#64748b" stroke-width="2"/>
  <text x="974" y="55" class="legend">Wired</text>
  <line x1="1050" y1="50" x2="1086" y2="50" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="1094" y="55" class="legend">Wi-Fi</text>

  <!-- 机器面板 -->
  <g filter="url(#shadow)">
    <rect x="40" y="130" width="1120" height="500" rx="20" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  </g>
  <text x="72" y="176" class="panel-title">Robot</text>

  <!-- 运控主机 -->
  <rect x="90" y="220" width="340" height="170" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="260" y="260" class="box-title" fill="#1e40af" textLength="73" lengthAdjust="spacingAndGlyphs">Motion control host</text>
  <text x="260" y="288" class="box-sub" textLength="209" lengthAdjust="spacingAndGlyphs">Motion control and system monitoring</text>
  <text x="260" y="312" class="box-sub">WiFi-AP：192.168.234.1</text>
  <text x="260" y="336" class="box-sub">Wired IP: 192.168.168.168</text>
  <text x="260" y="360" class="box-sub">UDP 8082 · WebSocket 8081</text>

  <!-- 交换机 -->
  <rect x="520" y="250" width="180" height="100" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="610" y="292" class="box-title">Switch</text>
  <text x="610" y="318" class="box-sub" textLength="73" lengthAdjust="spacingAndGlyphs">Internal network</text>

  <!-- 导航主机 -->
  <rect x="780" y="220" width="340" height="170" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="950" y="260" class="box-title" fill="#15803d" textLength="73" lengthAdjust="spacingAndGlyphs">Navigation host</text>
  <text x="950" y="288" class="box-sub" textLength="200" lengthAdjust="spacingAndGlyphs">Mapping, localization, navigation, obstacle avoidance</text>
  <text x="950" y="312" class="box-sub">Wired IP: 192.168.168.100</text>
  <text x="950" y="336" class="box-sub">Wireless IP: 192.168.168.100</text>

  <!-- 网口 x2 -->
  <rect x="520" y="480" width="180" height="90" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="610" y="517" class="box-title" fill="#b45309">Ethernet ×2</text>
  <text x="610" y="543" class="box-sub">Wired access</text>

  <!-- 内部链路 -->
  <line x1="430" y1="300" x2="516" y2="300" stroke="#64748b" stroke-width="2" marker-end="url(#m-slate)"/>
  <line x1="700" y1="300" x2="776" y2="300" stroke="#64748b" stroke-width="2" marker-end="url(#m-slate)"/>
  <line x1="610" y1="350" x2="610" y2="476" stroke="#64748b" stroke-width="2" marker-end="url(#m-slate)"/>

  <!-- 无线接入 -->
  <line x1="260" y1="666" x2="260" y2="394" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m-blue)"/>
  <text x="278" y="540" class="link-label" fill="#1d4ed8">Wi-Fi</text>
  <rect x="90" y="670" width="340" height="80" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="260" y="702" class="box-text" fill="#1d4ed8" textLength="164" lengthAdjust="spacingAndGlyphs">SDK host (Wi-Fi)</text>
  <text x="260" y="728" class="box-sub" textLength="164" lengthAdjust="spacingAndGlyphs">Connect to the robot&#x27;s Wi-Fi AP</text>

  <!-- 有线接入 -->
  <path d="M 950 666 V 610 H 610 V 574" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#m-orange)"/>
  <text x="780" y="602" class="link-label" fill="#b45309">Ethernet</text>
  <rect x="780" y="670" width="340" height="80" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="950" y="702" class="box-text" fill="#b45309" textLength="164" lengthAdjust="spacingAndGlyphs">SDK host (wired)</text>
  <text x="950" y="728" class="box-sub" textLength="246" lengthAdjust="spacingAndGlyphs">Connect directly or use the same LAN</text>
</svg>
