<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1010" viewBox="0 0 1600 1010" role="img" aria-labelledby="title desc">
  <title id="title">SDK and app control ownership</title>
  <desc id="desc">Two connection scenarios showing ownership transitions, callbacks, and client permissions.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
    <marker id="m-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cbd5e1"/>
    </marker>
    <style>
      text { font-family: Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .title { font-size: 40px; font-weight: 750; }
      .subtitle { font-size: 20px; fill: #475569; }
      .rule-title { font-size: 19px; font-weight: 700; }
      .rule-body { font-size: 15.5px; fill: #475569; }
      .panel-title { font-size: 25px; font-weight: 750; }
      .panel-subtitle { font-size: 16px; fill: #64748b; }
      .step-title { font-size: 17px; font-weight: 700; }
      .step-body { font-size: 14.5px; fill: #475569; }
      .step-no { font-size: 17px; font-weight: 800; fill: #fff; text-anchor: middle; dominant-baseline: middle; }
      .badge { font-size: 14px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .chip { font-size: 16px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .note-title { font-size: 15.5px; font-weight: 700; fill: #b45309; }
      .note-body { font-size: 14.5px; fill: #78350f; }
    </style>
  </defs>

  <rect width="1600" height="1010" fill="#f8fafc"/>
  <text x="80" y="74" class="title" textLength="191" lengthAdjust="spacingAndGlyphs">SDK and app control ownership</text>
  <text x="80" y="112" class="subtitle" textLength="610" lengthAdjust="spacingAndGlyphs">The first client gets control, and the app can take over. Observers can monitor state and trigger software emergency stop.</text>

  <!-- 核心规则卡片 -->
  <g filter="url(#shadow)">
    <rect x="80" y="140" width="453" height="96" rx="18" fill="#fff" stroke="#e2e8f0"/>
    <rect x="573" y="140" width="453" height="96" rx="18" fill="#ecfdf5" stroke="#86efac"/>
    <rect x="1066" y="140" width="454" height="96" rx="18" fill="#eff6ff" stroke="#93c5fd"/>
  </g>
  <circle cx="126" cy="188" r="20" fill="#334155"/><text x="126" y="188" class="step-no">1</text>
  <text x="160" y="180" class="rule-title" textLength="73" lengthAdjust="spacingAndGlyphs">First to connect</text>
  <text x="160" y="206" class="rule-body" textLength="291" lengthAdjust="spacingAndGlyphs">The first client to complete the handshake gets control</text>
  <circle cx="619" cy="188" r="20" fill="#16a34a"/><text x="619" y="188" class="step-no">2</text>
  <text x="653" y="180" class="rule-title" textLength="127" lengthAdjust="spacingAndGlyphs">The app can take control from the SDK</text>
  <text x="653" y="206" class="rule-body" textLength="337" lengthAdjust="spacingAndGlyphs">OnControlLost() moves the SDK into observer mode</text>
  <circle cx="1112" cy="188" r="20" fill="#2563eb"/><text x="1112" y="188" class="step-no">3</text>
  <text x="1146" y="180" class="rule-title" textLength="146" lengthAdjust="spacingAndGlyphs">The SDK cannot take over from the app</text>
  <text x="1146" y="206" class="rule-body" textLength="400" lengthAdjust="spacingAndGlyphs">Wait for the app to disconnect and for OnControlAvailable()</text>

  <!-- 场景 A 面板 -->
  <g filter="url(#shadow)">
    <rect x="80" y="272" width="720" height="640" rx="24" fill="#fff" stroke="#dbeafe" stroke-width="2"/>
  </g>
  <text x="112" y="318" class="panel-title" textLength="255" lengthAdjust="spacingAndGlyphs">A. The SDK connects first. The app takes over.</text>
  <text x="112" y="346" class="panel-subtitle" textLength="410" lengthAdjust="spacingAndGlyphs">The SDK controls, observes, then requests control again</text>

  <g stroke="#cbd5e1" stroke-width="2">
    <line x1="140" y1="417" x2="140" y2="440" marker-end="url(#m-flow)"/>
    <line x1="140" y1="479" x2="140" y2="502" marker-end="url(#m-flow)"/>
    <line x1="140" y1="541" x2="140" y2="564" marker-end="url(#m-flow)"/>
    <line x1="140" y1="603" x2="140" y2="626" marker-end="url(#m-flow)"/>
    <line x1="140" y1="665" x2="140" y2="688" marker-end="url(#m-flow)"/>
    <line x1="140" y1="727" x2="140" y2="750" marker-end="url(#m-flow)"/>
  </g>

  <circle cx="140" cy="400" r="17" fill="#16a34a"/><text x="140" y="400" class="step-no">1</text>
  <text x="176" y="398" class="step-title" textLength="209" lengthAdjust="spacingAndGlyphs">SDK completes the handshake and gets control</text>
  <text x="176" y="420" class="step-body" textLength="364" lengthAdjust="spacingAndGlyphs">It can send motion, task, and other regular commands</text>
  <rect x="664" y="387" width="108" height="26" rx="13" fill="#dcfce7"/><text x="718" y="400" class="badge" fill="#15803d">Controller</text>

  <circle cx="140" cy="462" r="17" fill="#2563eb"/><text x="140" y="462" class="step-no">2</text>
  <text x="176" y="460" class="step-title" textLength="164" lengthAdjust="spacingAndGlyphs">App connects and takes control</text>
  <text x="176" y="482" class="step-body" textLength="218" lengthAdjust="spacingAndGlyphs">The robot transfers control to the app</text>
  <rect x="664" y="449" width="108" height="26" rx="13" fill="#dbeafe"/><text x="718" y="462" class="badge" fill="#1d4ed8">App controls</text>

  <circle cx="140" cy="524" r="17" fill="#dc2626"/><text x="140" y="524" class="step-no">3</text>
  <text x="176" y="522" class="step-title">SDK receives OnControlLost()</text>
  <text x="176" y="544" class="step-body" textLength="309" lengthAdjust="spacingAndGlyphs">Stop regular commands. Software emergency stop remains available.</text>
  <rect x="664" y="511" width="108" height="26" rx="13" fill="#f1f5f9"/><text x="718" y="524" class="badge" fill="#475569">Observer</text>

  <circle cx="140" cy="586" r="17" fill="#64748b"/><text x="140" y="586" class="step-no">4</text>
  <text x="176" y="584" class="step-title" textLength="109" lengthAdjust="spacingAndGlyphs">SDK keeps listening</text>
  <text x="176" y="606" class="step-body" textLength="373" lengthAdjust="spacingAndGlyphs">It receives state and fault data while waiting for control</text>
  <rect x="664" y="573" width="108" height="26" rx="13" fill="#f1f5f9"/><text x="718" y="586" class="badge" fill="#475569">Observer</text>

  <circle cx="140" cy="648" r="17" fill="#64748b"/><text x="140" y="648" class="step-no">5</text>
  <text x="176" y="646" class="step-title" textLength="109" lengthAdjust="spacingAndGlyphs">App disconnects</text>
  <text x="176" y="668" class="step-body" textLength="382" lengthAdjust="spacingAndGlyphs">SDK receives OnControlAvailable()</text>
  <rect x="664" y="635" width="108" height="26" rx="13" fill="#f1f5f9"/><text x="718" y="648" class="badge" fill="#475569">Observer</text>

  <circle cx="140" cy="710" r="17" fill="#2563eb"/><text x="140" y="710" class="step-no">6</text>
  <text x="176" y="708" class="step-title">SDK calls TakeControl()</text>
  <text x="176" y="730" class="step-body" textLength="255" lengthAdjust="spacingAndGlyphs">Request control from the robot</text>
  <rect x="664" y="697" width="108" height="26" rx="13" fill="#e0f2fe"/><text x="718" y="710" class="badge" fill="#0369a1">Requesting</text>

  <circle cx="140" cy="772" r="17" fill="#16a34a"/><text x="140" y="772" class="step-no">7</text>
  <text x="176" y="770" class="step-title">SDK receives OnTakeControlAck(error_code = 0)</text>
  <text x="176" y="792" class="step-body" textLength="191" lengthAdjust="spacingAndGlyphs">Request succeeds. Resume regular control.</text>
  <rect x="664" y="759" width="108" height="26" rx="13" fill="#dcfce7"/><text x="718" y="772" class="badge" fill="#15803d">Controller</text>

  <rect x="112" y="824" width="656" height="44" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <text x="440" y="846" class="chip" fill="#15803d" textLength="364" lengthAdjust="spacingAndGlyphs">✔ The SDK regains control</text>

  <!-- 场景 B 面板 -->
  <g filter="url(#shadow)">
    <rect x="800" y="272" width="720" height="640" rx="24" fill="#fff" stroke="#dbeafe" stroke-width="2"/>
  </g>
  <text x="832" y="318" class="panel-title" textLength="255" lengthAdjust="spacingAndGlyphs">B. The app connects first. The SDK connects later.</text>
  <text x="832" y="346" class="panel-subtitle" textLength="309" lengthAdjust="spacingAndGlyphs">The SDK observes until the app disconnects</text>

  <g stroke="#cbd5e1" stroke-width="2">
    <line x1="860" y1="417" x2="860" y2="440" marker-end="url(#m-flow)"/>
    <line x1="860" y1="479" x2="860" y2="502" marker-end="url(#m-flow)"/>
    <line x1="860" y1="541" x2="860" y2="564" marker-end="url(#m-flow)"/>
    <line x1="860" y1="603" x2="860" y2="626" marker-end="url(#m-flow)"/>
    <line x1="860" y1="665" x2="860" y2="688" marker-end="url(#m-flow)"/>
  </g>

  <circle cx="860" cy="400" r="17" fill="#2563eb"/><text x="860" y="400" class="step-no">1</text>
  <text x="896" y="398" class="step-title" textLength="209" lengthAdjust="spacingAndGlyphs">App completes the handshake and gets control</text>
  <text x="896" y="420" class="step-body" textLength="209" lengthAdjust="spacingAndGlyphs">The app controls because it connected first</text>
  <rect x="1384" y="387" width="108" height="26" rx="13" fill="#dbeafe"/><text x="1438" y="400" class="badge" fill="#1d4ed8">App controls</text>

  <circle cx="860" cy="462" r="17" fill="#64748b"/><text x="860" y="462" class="step-no">2</text>
  <text x="896" y="460" class="step-title" textLength="109" lengthAdjust="spacingAndGlyphs">SDK completes the handshake</text>
  <text x="896" y="482" class="step-body" textLength="264" lengthAdjust="spacingAndGlyphs">The SDK becomes an observer</text>
  <rect x="1384" y="449" width="108" height="26" rx="13" fill="#f1f5f9"/><text x="1438" y="462" class="badge" fill="#475569">Observer</text>

  <circle cx="860" cy="524" r="17" fill="#64748b"/><text x="860" y="524" class="step-no">3</text>
  <text x="896" y="522" class="step-title" textLength="146" lengthAdjust="spacingAndGlyphs">SDK monitors state</text>
  <text x="896" y="544" class="step-body" textLength="355" lengthAdjust="spacingAndGlyphs">It waits for control without sending regular commands</text>
  <rect x="1384" y="511" width="108" height="26" rx="13" fill="#f1f5f9"/><text x="1438" y="524" class="badge" fill="#475569">Observer</text>

  <circle cx="860" cy="586" r="17" fill="#2563eb"/><text x="860" y="586" class="step-no">4</text>
  <text x="896" y="584" class="step-title" textLength="109" lengthAdjust="spacingAndGlyphs">App disconnects</text>
  <text x="896" y="606" class="step-body" textLength="382" lengthAdjust="spacingAndGlyphs">SDK receives OnControlAvailable()</text>
  <rect x="1384" y="573" width="108" height="26" rx="13" fill="#f1f5f9"/><text x="1438" y="586" class="badge" fill="#475569">Observer</text>

  <circle cx="860" cy="648" r="17" fill="#2563eb"/><text x="860" y="648" class="step-no">5</text>
  <text x="896" y="646" class="step-title">SDK calls TakeControl()</text>
  <text x="896" y="668" class="step-body" textLength="164" lengthAdjust="spacingAndGlyphs">Request control from the robot</text>
  <rect x="1384" y="635" width="108" height="26" rx="13" fill="#e0f2fe"/><text x="1438" y="648" class="badge" fill="#0369a1">Requesting</text>

  <circle cx="860" cy="710" r="17" fill="#16a34a"/><text x="860" y="710" class="step-no">6</text>
  <text x="896" y="708" class="step-title">SDK receives OnTakeControlAck(error_code = 0)</text>
  <text x="896" y="730" class="step-body" textLength="246" lengthAdjust="spacingAndGlyphs">The SDK becomes the controller</text>
  <rect x="1384" y="697" width="108" height="26" rx="13" fill="#dcfce7"/><text x="1438" y="710" class="badge" fill="#15803d">Controller</text>

  <rect x="832" y="760" width="656" height="120" rx="12" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="856" y="790" class="note-title" textLength="200" lengthAdjust="spacingAndGlyphs">Gateway behavior</text>
  <text x="856" y="814" class="note-body" textLength="673" lengthAdjust="spacingAndGlyphs">If the app calls ReleaseControl() and stays connected, TakeControl() may still fail.</text>
  <text x="856" y="838" class="note-body" textLength="491" lengthAdjust="spacingAndGlyphs">Request control after the app disconnects and OnControlAvailable() arrives.</text>

  <!-- 底部权限条 -->
  <rect x="240" y="936" width="320" height="48" rx="24" fill="#f0fdf4" stroke="#86efac"/>
  <text x="400" y="960" class="chip" fill="#15803d" textLength="191" lengthAdjust="spacingAndGlyphs">Regular commands: controller</text>
  <rect x="600" y="936" width="420" height="48" rx="24" fill="#fff" stroke="#e2e8f0"/>
  <text x="810" y="960" class="chip" fill="#475569" textLength="282" lengthAdjust="spacingAndGlyphs">State and faults: both clients</text>
  <rect x="1060" y="936" width="320" height="48" rx="24" fill="#fff7ed" stroke="#fdba74"/>
  <text x="1220" y="960" class="chip" fill="#c2410c" textLength="218" lengthAdjust="spacingAndGlyphs">Software emergency stop and reset: both clients</text>
</svg>
